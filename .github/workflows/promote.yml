name: Promote
run-name: "Promote ${{ inputs.repos }}${{ inputs.allow_big_batch == true && ' [BIG BATCH]' || '' }}"

on:
  workflow_dispatch:
    inputs:
      repos:
        description: "'all', or exact repo names comma-separated. A subset needs a reason."
        required: true
        default: "all"
        type: string
      allow_big_batch:
        description: "Allow a batch over the per-repo limit (40 commits). Allows nothing else - CI, ancestry, migrations and pauses still stop the run. Needs a reason."
        required: false
        default: false
        type: boolean
      reason:
        description: "Why this run is unusual. Required for a subset or a big batch. Goes in the release record, with your name."
        required: false
        default: ""
        type: string
      maintenance_ack:
        description: "Only matters if the batch adds migrations - then anything but not-answered. not-answered = refuse to ship migrations. screen-is-up = you switched the maintenance screen on, and the run checks prod agrees before shipping. expand-only = the migration only adds things, so users can stay online - your call, nothing verifies it."
        required: false
        default: "not-answered"
        type: choice
        options: [not-answered, screen-is-up, expand-only]

# ONE press. SHAs are pinned in phase 1 and everything downstream uses them, never a branch
# name - so the run ships exactly what it checked. There is no ref input and no candidate
# state: candidate lifetime is the length of this run.

permissions:
  contents: write

env:
  TS: ""

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      # The App, not a PAT: the ff push to `main` has to bypass the `pull_request` rule, and a
      # ruleset bypass actor can only be a role, a team or an App - never a token. Scoping the
      # bypass to one automation is the whole point; a PAT would mean whitelisting a human.
      - name: Mint installation token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          # Without owner+repositories the token is scoped to THIS repo only and every
          # cross-repo call 404s - which reads as a permissions fault, not a scoping one.
          # pilot-infra is in the list because the manifest is committed back to it.
          repositories: pilot-infra,pilot-api,pilot-web

      # Workflow-level `env:` cannot see step outputs, so GH_TOKEN is exported here instead.
      # The action masks the token, so it stays redacted in logs after the export.
      - name: Export token as GH_TOKEN
        run: echo "GH_TOKEN=${{ steps.app-token.outputs.token }}" >> "$GITHUB_ENV"

      # Same identity for the manifest commit as for the promotion itself - otherwise the
      # release record is authored by GITHUB_TOKEN while the ship it records was the App.
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Guard - irregular runs need a reason
        env:
          IN_BIG: ${{ inputs.allow_big_batch }}
          IN_REPOS: ${{ inputs.repos }}
          IN_REASON: ${{ inputs.reason }}
        run: |
          # Inputs go through env, never string-interpolated into the script: a reason
          # containing a quote would otherwise break the shell (and later the manifest).
          IRREGULAR=""
          if [ "$IN_BIG" = "true" ]; then IRREGULAR="allow_big_batch"; fi
          if [ "$IN_REPOS" != "all" ]; then
            IRREGULAR="${IRREGULAR:+$IRREGULAR and }a repo subset ($IN_REPOS)"
          fi
          if [ -n "$IRREGULAR" ] && [ -z "$IN_REASON" ]; then
            echo "::error::$IRREGULAR requires a reason. It is posted verbatim and stored permanently in the release manifest. A partial or forced promotion with no recorded why is exactly what this gate exists to prevent - in six months nobody will remember, and the manifest is what rollback reads."
            exit 1
          fi
          if [ -n "$IRREGULAR" ]; then echo "irregular run ($IRREGULAR), reason recorded"; fi

      # ---------------------------------------------------------------- phase 1: pin
      - name: Phase 1 - pin development tips
        id: pin
        env:
          IN_REPOS: ${{ inputs.repos }}
        run: |
          set -euo pipefail
          ORG=$(jq -r .org config/repos.json)
          TS=$(date -u +%Y-%m-%d-%H%M)
          echo "TS=$TS" >> "$GITHUB_ENV"
          echo "ORG=$ORG" >> "$GITHUB_ENV"

          if [ "$IN_REPOS" = "all" ]; then
            SELECTED=$(jq -c '[.ship_order[].name]' config/repos.json)
          else
            # Tolerate "a, b" as well as "a,b"; drop empties from a trailing comma.
            SELECTED=$(printf '%s' "$IN_REPOS" | tr ',' '\n' \
              | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' | grep -v '^$' \
              | jq -R . | jq -sc .)
          fi
          echo "selected: $SELECTED"

          # Every requested name must exist. Silently ignoring a typo would mean a repo the
          # presser believed they were shipping quietly stays behind - and the manifest would
          # look deliberate.
          UNKNOWN=$(jq -r --argjson sel "$SELECTED" \
            '[.ship_order[].name] as $known | [$sel[] | select(. as $n | $known | index($n) | not)] | join(", ")' \
            config/repos.json)
          if [ -n "$UNKNOWN" ]; then
            echo "::error::unknown repo name(s): $UNKNOWN. Valid names are: $(jq -r '[.ship_order[].name] | join(", ")' config/repos.json). Use exact repo names, not nicknames."
            exit 1
          fi

          # Preserve ship order regardless of how the input was typed.
          jq -c --argjson sel "$SELECTED" \
            '[.ship_order[] | select(.name as $n | $sel | index($n))]' \
            config/repos.json > /tmp/plan.json

          COUNT=$(jq 'length' /tmp/plan.json)
          if [ "$COUNT" = "0" ]; then
            echo "::error::no repos selected from '$IN_REPOS'"
            exit 1
          fi

          # Pin every selected repo's development tip. Nothing downstream reads a branch name.
          jq -c '.[]' /tmp/plan.json | while read -r r; do
            NAME=$(echo "$r" | jq -r .name)
            SHA=$(gh api "repos/$ORG/$NAME/git/ref/heads/development" --jq .object.sha)
            MAIN=$(gh api "repos/$ORG/$NAME/git/ref/heads/main" --jq .object.sha)
            echo "$r" | jq -c --arg s "$SHA" --arg m "$MAIN" '. + {pinned:$s, main_before:$m}'
          done > /tmp/pinned.jsonl

          jq -s -c . /tmp/pinned.jsonl > /tmp/pinned.json
          jq -r '.[] | "  \(.name): main \(.main_before[0:8]) -> pinned \(.pinned[0:8])"' /tmp/pinned.json

          {
            echo "## Promote $TS"
            echo ""
            echo "| repo | main before | pinned development tip |"
            echo "|---|---|---|"
            jq -r '.[] | "| \(.name) | `\(.main_before[0:8])` | `\(.pinned[0:8])` |"' /tmp/pinned.json
          } >> "$GITHUB_STEP_SUMMARY"

      # ------------------------------------------------------------ phase 2: preflight
      - name: Phase 2 - preflight
        id: preflight
        run: |
          set -euo pipefail
          BREAKER=$(jq -r .breaker_delta config/repos.json)

          PAUSED=$(jq -r '.paused_until // "null"' state/pause.json)
          if [ "$PAUSED" != "null" ] && [ "$PAUSED" != "" ]; then
            NOW=$(date -u +%s); UNTIL=$(date -u -d "$PAUSED" +%s 2>/dev/null || echo 0)
            if [ "$UNTIL" -gt "$NOW" ]; then
              echo "::error::promotion paused until $PAUSED - $(jq -r .reason state/pause.json)"
              exit 1
            fi
            echo "pause expired at $PAUSED, proceeding"
          fi

          HALT=0
          MIGRATIONS_FOUND=0
          : > /tmp/checked.jsonl

          jq -c '.[]' /tmp/pinned.json | while read -r r; do
            NAME=$(echo "$r" | jq -r .name)
            SHA=$(echo "$r" | jq -r .pinned)
            MPATH=$(echo "$r" | jq -r .migrations_path)

            CMP=$(gh api "repos/$ORG/$NAME/compare/main...$SHA")
            STATUS=$(echo "$CMP" | jq -r .status)
            AHEAD=$(echo "$CMP" | jq -r .ahead_by)
            BEHIND=$(echo "$CMP" | jq -r .behind_by)

            # stdout in this loop is the JSONL stream - all diagnostics must go to stderr.
            # Ancestry: main must be an ancestor of the pinned SHA, or ff is impossible.
            if [ "$BEHIND" != "0" ]; then
              echo "::error::$NAME: main is $BEHIND commits ahead of the pinned SHA - ancestry broken, fast-forward impossible. A hotfix landed on main; merge the back-merge sync PR first: https://github.com/$ORG/$NAME/pulls" >&2
              echo "HALT" > /tmp/halt
            fi

            MIGS="[]"
            if [ -n "$MPATH" ] && [ "$MPATH" != "null" ]; then
              MIGS=$(echo "$CMP" | jq -c --arg p "$MPATH" '[.files[]?.filename | select(startswith($p))]')
              if [ "$(echo "$MIGS" | jq 'length')" != "0" ]; then echo "MIGS" > /tmp/migs; fi
            fi

            if [ "$AHEAD" -gt "$BREAKER" ] && [ "${{ inputs.allow_big_batch }}" != "true" ]; then
              echo "::error::$NAME: delta $AHEAD exceeds the per-repo limit of $BREAKER commits. If that is expected, re-run with allow_big_batch and a reason." >&2
              echo "HALT" > /tmp/halt
            fi

            echo "$r" | jq -c --arg st "$STATUS" --argjson a "$AHEAD" --argjson m "$MIGS" \
              '. + {status:$st, delta:$a, migrations:$m}'
          done > /tmp/checked.jsonl

          jq -s -c . /tmp/checked.jsonl > /tmp/checked.json
          if [ -f /tmp/halt ]; then exit 1; fi

          if [ -f /tmp/migs ] && [ "${{ inputs.maintenance_ack }}" = "not-answered" ]; then
            echo "::error::this batch adds migrations, so maintenance_ack must be answered. Read the files listed below, then re-run with screen-is-up (you switched the maintenance screen on) or expand-only (it only adds things, users can stay online). Leaving it unanswered is not a way to ship them."
            jq -r '.[] | select((.migrations|length) > 0) | "  " + .name + ": " + (.migrations|tostring)' /tmp/checked.json
            exit 1
          fi

          {
            echo ""
            echo "### Preflight"
            echo ""
            echo "| repo | delta | migrations |"
            echo "|---|---|---|"
            jq -r '.[] | "| \(.name) | \(.delta) | \(if (.migrations|length)>0 then (.migrations|join("<br>")) else "-" end) |"' /tmp/checked.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Weekend-eve notice
        run: |
          DOW=$(date -u +%u)
          if [ "$DOW" -ge 5 ]; then
            echo "::warning::Pressed on a Friday or weekend. Warned, not blocked. Check: is anyone available to fix forward if this breaks? Recovery ladder is in the release-rollback skill."
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> **Weekend-eve press.** Fix-forward is the recovery path and it needs a human." >> "$GITHUB_STEP_SUMMARY"
          fi

      # -------------------------------------------------------------- phase 3: CI gate
      - name: Phase 3 - CI gate on the pinned SHAs
        run: |
          set -euo pipefail
          # NOTE: workflow_dispatch cannot target a bare SHA (GitHub requires a branch or tag),
          # so this gate VERIFIES the pinned commit already has green required checks rather
          # than triggering CI. CI runs on every push to development, so in the normal case the
          # checks exist. If they do not, that is a real halt: nothing has tested these bytes.
          CI_TIMEOUT=$(jq -r '.ci_timeout_minutes // 20' config/repos.json)

          jq -c '.[] | select(.delta > 0)' /tmp/checked.json | while read -r r; do
            NAME=$(echo "$r" | jq -r .name)
            SHA=$(echo "$r" | jq -r .pinned)
            REQ=$(echo "$r" | jq -c '.required_checks')

            # Pressing seconds after a merge is normal, and CI may not have registered yet.
            # "Not started" and "finished red" are different situations: wait for the first,
            # halt on the second. Treating both as untested made a legitimate press fail and
            # forced a re-press - the friction this design exists to avoid.
            #
            # All check matching goes through jq, never shell word-splitting: real check names
            # contain spaces (dash-admin's "Frontend Build" / "Backend Build").
            for _ in $(seq 1 $(( CI_TIMEOUT * 4 ))); do
              RUNS=$(gh api "repos/$ORG/$NAME/commits/$SHA/check-runs" \
                --jq '[.check_runs[] | {name, status, conclusion}]' 2>/dev/null || echo '[]')
              PENDING=$(jq -n --argjson runs "$RUNS" --argjson req "$REQ" \
                '[ $req[] | . as $c | ($runs | map(select(.name==$c)) | last | .status // "absent") ]
                 | map(select(. != "completed")) | length')
              if [ "$PENDING" = "0" ]; then break; fi
              echo "  $NAME: waiting on $PENDING required check(s) at ${SHA:0:8}"
              sleep 15
            done

            BAD=$(jq -n --argjson runs "$RUNS" --argjson req "$REQ" \
              '[ $req[] | . as $c
                 | {check:$c, conclusion: ($runs | map(select(.name==$c)) | last | .conclusion // "never ran")} ]
               | map(select(.conclusion != "success"))')

            if [ "$(echo "$BAD" | jq 'length')" = "0" ]; then
              echo "  $NAME: all required checks green on ${SHA:0:8}"
            else
              echo "$BAD" | jq -r --arg n "$NAME" --arg s "$SHA" '.[] |
                "::error::\($n): required check \(.check|tojson) is \(.conclusion|tojson) on \($s). Refusing to ship bytes that are not green."'
              echo HALT > /tmp/halt3
            fi
          done
          [ -f /tmp/halt3 ] && exit 1 || true

      - name: Phase 4 - verify maintenance is on
        if: inputs.maintenance_ack == 'screen-is-up'
        run: |
          # PILOT STUB. In dash-infra this queries prod BE GraphQL for maintenance status and
          # requires enabled:true before shipping a migration-bearing batch.
          echo "::warning::maintenance verify is a stub in the pilot - dash-infra must query prod and require enabled:true here."
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Maintenance: acknowledged \`screen-is-up\` (verification stubbed in pilot)." >> "$GITHUB_STEP_SUMMARY"

      # ----------------------------------------------------------------- phase 5: ship
      - name: Phase 5 - ship in order
        id: ship
        run: |
          set -uo pipefail
          TIMEOUT=$(jq -r .deploy_timeout_minutes config/repos.json)
          : > /tmp/results.jsonl
          rm -f /tmp/failed_repo /tmp/last_run_id

          # Newest COMPLETED deploy conclusion for an exact SHA. Empty = never deployed.
          deploy_conclusion() {
            gh run list -R "$ORG/$1" --workflow "$2" --limit 30 \
              --json headSha,status,conclusion \
              --jq "[.[] | select(.headSha==\"$3\" and .status==\"completed\")] | first | .conclusion" 2>/dev/null
          }

          # Block until a deploy for SHA completes. Echoes the conclusion, or "timeout".
          # Records the run id in /tmp/last_run_id (not stdout - stdout is the return value).
          wait_deploy() {
            local N=$1 WF=$2 S=$3 RID ST
            rm -f /tmp/last_run_id
            for _ in $(seq 1 $(( TIMEOUT * 4 ))); do
              sleep 15
              RID=$(gh run list -R "$ORG/$N" --workflow "$WF" --limit 30 \
                --json databaseId,headSha \
                --jq "[.[] | select(.headSha==\"$S\")] | first | .databaseId" 2>/dev/null)
              if [ -z "$RID" ] || [ "$RID" = "null" ]; then continue; fi
              ST=$(gh run view "$RID" -R "$ORG/$N" --json status --jq .status)
              if [ "$ST" = "completed" ]; then
                echo "$RID" > /tmp/last_run_id
                gh run view "$RID" -R "$ORG/$N" --json conclusion --jq .conclusion
                return
              fi
            done
            echo "timeout"
          }

          for i in $(seq 0 $(( $(jq 'length' /tmp/checked.json) - 1 ))); do
            r=$(jq -c ".[$i]" /tmp/checked.json)
            NAME=$(echo "$r" | jq -r .name)
            SHA=$(echo "$r" | jq -r .pinned)
            DELTA=$(echo "$r" | jq -r .delta)
            WF=$(echo "$r" | jq -r .deploy_workflow)

            if [ -f /tmp/failed_repo ]; then
              echo "::warning::$NAME: NOT SHIPPED - aborted after $(cat /tmp/failed_repo) failed"
              echo "$r" | jq -c '. + {result:"not-attempted"}' >> /tmp/results.jsonl
              continue
            fi

            CURRENT=$(gh api "repos/$ORG/$NAME/git/ref/heads/main" --jq .object.sha)

            # "Shipped" means main advanced AND the deploy for that SHA went green. Those are
            # two separate facts, and only checking the ref made a repo whose deploy failed
            # look finished on the next press - so a green run could sit on top of a broken
            # production. Verified in the pilot 2026-08-27. The ref is never enough.
            if [ "$CURRENT" = "$SHA" ]; then
              CONC=$(deploy_conclusion "$NAME" "$WF" "$SHA")
              if [ "$CONC" = "success" ]; then
                if [ "$DELTA" = "0" ]; then
                  echo "$NAME: no delta, prod healthy on ${SHA:0:8} - nothing to do"
                  echo "$r" | jq -c '. + {result:"no-delta"}' >> /tmp/results.jsonl
                else
                  echo "$NAME: main already at pinned SHA and deployed green - skip"
                  echo "$r" | jq -c '. + {result:"already-shipped"}' >> /tmp/results.jsonl
                fi
                continue
              fi

              # main is where it belongs but production is not on it. Retry the deploy: this
              # is what "re-press resumes where it stopped" has to actually mean.
              echo "::warning::$NAME: main is at ${SHA:0:8} but its deploy is '${CONC:-never ran}'. Re-dispatching the deploy."
              gh workflow run "$WF" -R "$ORG/$NAME" --ref main >/dev/null 2>&1 || true
              CONC=$(wait_deploy "$NAME" "$WF" "$SHA")
              RID=$(cat /tmp/last_run_id 2>/dev/null || echo "")
              if [ "$CONC" != "success" ]; then
                echo "::error::$NAME: redeploy of ${SHA:0:8} failed ('$CONC'). Production is NOT running the SHA main points at."
                echo "$r" | jq -c --arg c "$CONC" --arg run "$RID" '. + {result:("redeploy-"+$c), deploy_run:$run}' >> /tmp/results.jsonl
                echo "$NAME" > /tmp/failed_repo; continue
              fi
              echo "$NAME: redeployed ${SHA:0:8} successfully"
              echo "$r" | jq -c --arg run "$RID" '. + {result:"redeployed", deploy_run:$run}' >> /tmp/results.jsonl
              continue
            fi

            if [ "$DELTA" = "0" ]; then
              # delta 0 but main != pinned means main is AHEAD of development. Preflight's
              # ancestry check should have caught it; refuse rather than guess.
              echo "::error::$NAME: delta is 0 but main (${CURRENT:0:8}) != pinned (${SHA:0:8}). Ancestry is inconsistent - stopping."
              echo "$r" | jq -c '. + {result:"inconsistent"}' >> /tmp/results.jsonl
              echo "$NAME" > /tmp/failed_repo; continue
            fi

            # force:false makes this fast-forward-only, enforced server-side. A non-ff
            # advance returns 422 rather than rewriting anything.
            echo "$NAME: fast-forwarding main -> ${SHA:0:8}"
            if ! gh api -X PATCH "repos/$ORG/$NAME/git/refs/heads/main" \
                   -f sha="$SHA" -F force=false > /tmp/push.json 2>/tmp/push.err; then
              echo "::error::$NAME: fast-forward push REJECTED. $(cat /tmp/push.err)"
              echo "$r" | jq -c '. + {result:"push-rejected"}' >> /tmp/results.jsonl
              FAILED="$NAME"; continue
            fi

            # Deploy-wait: never move to the next repo on an unverified deploy.
            echo "$NAME: waiting for deploy of ${SHA:0:8}"
            CONC=$(wait_deploy "$NAME" "$WF" "$SHA")
            RID=$(cat /tmp/last_run_id 2>/dev/null || echo "")

            if [ "$CONC" != "success" ]; then
              echo "::error::$NAME: prod deploy did not succeed ('$CONC'). main IS already advanced to ${SHA:0:8} - production may still be on old code. Inspect deploy-state/state.json, fix forward, then re-press: the retry path re-dispatches this deploy rather than skipping it."
              echo "$r" | jq -c --arg c "$CONC" --arg run "$RID" '. + {result:("deploy-"+$c), deploy_run:$run}' >> /tmp/results.jsonl
              echo "$NAME" > /tmp/failed_repo; continue
            fi

            echo "$NAME: shipped and deployed"
            echo "$r" | jq -c --arg run "$RID" '. + {result:"shipped", deploy_run:$run}' >> /tmp/results.jsonl
          done

          jq -s -c . /tmp/results.jsonl > /tmp/results.json
          {
            echo ""
            echo "### Ship result"
            echo ""
            echo "| repo | delta | result |"
            echo "|---|---|---|"
            jq -r '.[] | "| \(.name) | \(.delta) | **\(.result)** |"' /tmp/results.json
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -f /tmp/failed_repo ]; then
            HALTED=$(cat /tmp/failed_repo)
            echo "::error::RUN HALTED at ${HALTED}. Repos after it were not attempted. Fix forward, then re-press: repos already shipped AND deployed green are skipped, a repo whose deploy failed is retried."
            echo "halted=${HALTED}" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      # --------------------------------------------------------------- phase 6: record
      - name: Phase 6 - tag moved repos and commit the manifest
        if: always() && steps.pin.outcome == 'success'
        env:
          IN_BIG: ${{ inputs.allow_big_batch }}
          IN_REPOS: ${{ inputs.repos }}
          IN_REASON: ${{ inputs.reason }}
          IN_ACK: ${{ inputs.maintenance_ack }}
        run: |
          set -uo pipefail
          if [ ! -f /tmp/results.json ]; then
            echo "::notice::run halted before shipping - no manifest written"
            exit 0
          fi
          PRUNE=$(jq -r .tag_prune_days config/repos.json)

          # Tags only on repos whose main actually moved. The manifest - not the tag set -
          # is the restore-point index, because a repo that did not move has no tag for
          # this run and would otherwise be unfindable.
          jq -c '.[] | select(.result=="shipped")' /tmp/results.json | while read -r r; do
            NAME=$(echo "$r" | jq -r .name)
            SHA=$(echo "$r" | jq -r .pinned)
            if gh api -X POST "repos/$ORG/$NAME/git/refs" \
                 -f ref="refs/tags/promote/$TS" -f sha="$SHA" >/dev/null 2>&1; then
              echo "tagged $NAME promote/$TS"
            else
              # Tags are immutable by policy - never moved. A collision means this run is a
              # re-press within the same minute; the existing tag already marks the SHA.
              echo "::notice::$NAME: tag promote/$TS already exists, left untouched"
            fi

            CUTOFF=$(date -u -d "-$PRUNE days" +%Y-%m-%d)
            gh api "repos/$ORG/$NAME/git/matching-refs/tags/promote/" --jq '.[].ref' 2>/dev/null \
            | sed 's|refs/tags/||' | while read -r TAG; do
                TAGDATE=$(echo "$TAG" | sed 's|promote/||' | cut -c1-10)
                if [[ "$TAGDATE" < "$CUTOFF" ]]; then
                  gh api -X DELETE "repos/$ORG/$NAME/git/refs/tags/$TAG" >/dev/null 2>&1 \
                    && echo "pruned $NAME $TAG"
                fi
              done
          done

          YEAR=$(echo "$TS" | cut -c1-4)
          mkdir -p "releases/$YEAR"
          jq -n \
            --arg ts "$TS" \
            --arg actor "${{ github.actor }}" \
            --arg run "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --arg reason "$IN_REASON" \
            --argjson bigbatch "$IN_BIG" \
            --arg ack "$IN_ACK" \
            --arg selected "$IN_REPOS" \
            --argjson repos "$(jq -c '[.[] | {name, from:.main_before, to:.pinned, delta, migrations, result, deploy_run:(.deploy_run // null)}]' /tmp/results.json)" \
            '{timestamp:$ts, actor:$actor, run_url:$run, big_batch_allowed:$bigbatch, reason:$reason,
              maintenance_ack:$ack, partial:($selected != "all"), repos:$repos}' \
            > "releases/$YEAR/$TS.json"

          echo "### Manifest" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat "releases/$YEAR/$TS.json" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          git config user.name "promote-bot"
          git config user.email "promote-bot@users.noreply.github.com"
          git add "releases/$YEAR/$TS.json"
          git commit -m "release $TS" || exit 0
          git pull --rebase --autostash origin "${{ github.ref_name }}" || true
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Phase 7 - report
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          # No-op runs report too: silence must never be the same as "nothing to do".
          SUMMARY="Promote $TS by ${{ github.actor }} - ${{ job.status }}"
          if [ -f /tmp/results.json ]; then
            DETAIL=$(jq -r '[.[] | "\(.name): \(.result) (+\(.delta))"] | join(" | ")' /tmp/results.json)
          else
            DETAIL="halted in preflight"
          fi
          echo "$SUMMARY - $DETAIL"
          if [ -n "${SLACK_WEBHOOK_URL:-}" ]; then
            jq -n --arg t "$SUMMARY"$'\n'"$DETAIL"$'\n'"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              '{text:$t}' | curl -sS -X POST -H 'Content-type: application/json' -d @- "$SLACK_WEBHOOK_URL"
          else
            echo "::notice::SLACK_WEBHOOK_URL not set - report is in the job summary only."
          fi
